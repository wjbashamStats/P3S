<title>Golf Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first app shell (one column, max 760px), sticky header, fixed bottom tab bar; logging and detail open as sheets over the page. */
:root {
  --bg: #f2f5f0;
  --surface: #ffffff;
  --surface-2: #e7ece4;
  --line: #d3dbcf;
  --ink: #142019;
  --ink-2: #485a4e;
  --ink-3: #6f7f74;
  --accent: #16704a;
  --accent-ink: #ffffff;
  --accent-soft: #d9eee1;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --good: #0a7d0a;
  --bad: #c43535;
  --star: #c98500;
  --chart-bg: #fcfcfb;
  --shadow: 0 10px 30px rgba(20, 32, 25, 0.18);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1310; --surface: #161f1a; --surface-2: #1e2a23; --line: #2b3a31;
    --ink: #e7efe9; --ink-2: #b2c0b6; --ink-3: #85958b;
    --accent: #45b980; --accent-ink: #04120a; --accent-soft: #1b3a2a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good: #3cbf3c; --bad: #e66767; --star: #e0a526;
    --chart-bg: #1a1a19; --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1310; --surface: #161f1a; --surface-2: #1e2a23; --line: #2b3a31;
  --ink: #e7efe9; --ink-2: #b2c0b6; --ink-3: #85958b;
  --accent: #45b980; --accent-ink: #04120a; --accent-soft: #1b3a2a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good: #3cbf3c; --bad: #e66767; --star: #e0a526;
  --chart-bg: #1a1a19; --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.shell { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 104px; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 14px 10px;
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.01em; display: flex; align-items: center; gap: 8px; }
.brand svg { color: var(--accent); }
.status { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; text-align: right; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.status.ok i { background: var(--good); }
.status.warn i { background: var(--star); }

h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h3 { font-size: 13px; font-weight: 600; margin: 0; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
.view { display: flex; flex-direction: column; gap: 22px; }
.section { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
p { margin: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 8px 14px; font-weight: 500; cursor: pointer; min-height: 38px;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.sm { min-height: 32px; padding: 5px 11px; font-size: 13px; }
.btn.big { min-height: 52px; font-size: 16px; font-weight: 600; border-radius: 14px; flex: 1; }
label.btn input[type=file] { display: none; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

.starts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.start {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r);
  padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-width: 0;
}
.start:hover { border-color: var(--ink-3); }
.start b { font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: 0.01em; }
.start .bar { height: 4px; border-radius: 2px; }
@media (max-width: 520px) { .starts { grid-template-columns: 1fr; } .start { flex-direction: row; align-items: center; } .start .bar { width: 4px; height: 36px; } }

.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; color: inherit; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.item .grow { flex: 1; min-width: 0; }
.item .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { font-size: 13px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .right { text-align: right; flex: none; }
.thumb { width: 52px; height: 66px; border-radius: 8px; background: var(--surface-2); overflow: hidden; flex: none; display: grid; place-items: center; color: var(--ink-3); }
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }

.score { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; }
.topar { font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); display: inline-block; margin-top: 4px; }
.topar.under { background: var(--accent-soft); color: var(--accent); }
.tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--ink-3); }
.tile .v { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .c { font-size: 12px; color: var(--ink-3); }

.hcp { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 16px 18px; }
.hcp .big { font-family: var(--font-display); font-weight: 700; font-size: 54px; line-height: 0.9; }
.hcp .btn { background: transparent; border-color: currentColor; color: inherit; }

.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.chart { width: 100%; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
details.table summary { font-size: 12px; color: var(--ink-3); cursor: pointer; }
details.table .scroll { overflow-x: auto; margin-top: 6px; }
table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 10px 4px 0; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
#tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }

.trend { font-size: 13px; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
.trend.up { color: var(--good); }
.trend.down { color: var(--bad); }
.trend.flat, .trend.na { color: var(--ink-3); font-weight: 500; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
nav.tabs .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { background: none; border: 0; padding: 9px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--ink-3); cursor: pointer; }
nav.tabs button[aria-current="page"] { color: var(--accent); }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(8, 14, 10, 0.45); display: flex; justify-content: center; align-items: flex-end; }
.sheet {
  background: var(--bg); width: 100%; max-width: 760px; max-height: 94%; height: 94%;
  border-radius: 18px 18px 0 0; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
.sheet-head h2 { font-size: 20px; text-align: center; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { overflow-y: auto; padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }

.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.form .full { grid-column: 1 / -1; }
@media (max-width: 520px) { .form { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.field input, .field select, .field textarea, .inp {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 11px; min-height: 40px; width: 100%; min-width: 0;
}
.field textarea { resize: vertical; min-height: 84px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }

.drill { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.drill .meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.drill .meter i { display: block; height: 100%; background: var(--accent); }
.mm { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.mm button { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); font-weight: 700; font-size: 16px; cursor: pointer; background: var(--surface); }
.mm .make { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mm .miss { color: var(--bad); }
.mm .undo { padding: 0 16px; color: var(--ink-2); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; cursor: pointer; }
.stepper input { width: 84px; text-align: center; }
.stars { display: flex; gap: 4px; }
.stars button { background: none; border: 0; font-size: 26px; color: var(--star); cursor: pointer; padding: 0 2px; line-height: 1; }
.timer { font-family: var(--font-display); font-size: 28px; font-weight: 700; }
.pick { display: flex; flex-direction: column; gap: 8px; }
.pick button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.pick button:hover { border-color: var(--ink-3); }

/* Swing player */
.player-wrap { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.player { position: relative; background: #000; border-radius: 12px; overflow: hidden; width: min(100%, calc(62vh * 0.5625)); max-width: 100%; aspect-ratio: 9 / 16; margin-inline: auto; }
.player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.player canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.player .hint { position: absolute; left: 10px; top: 10px; font-size: 12px; color: #fff; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 6px; }
.controls { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.controls input[type=range] { width: 100%; accent-color: var(--accent); }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.shots .shot { position: relative; aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
.shots .shot img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.shots .shot button { position: absolute; right: 4px; top: 4px; background: rgba(0,0,0,.6); color: #fff; border: 0; border-radius: 6px; font-size: 12px; padding: 2px 6px; cursor: pointer; }
.analysis-out { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 14px; max-height: 420px; overflow-y: auto; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.compare .player { width: min(100%, calc(56vh * 0.5625)); }
.notice { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--ink-2); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.viewer { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.92); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>

<div class="shell">
  <header class="top">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 2h2v20H6z"/><path fill="currentColor" d="M8 3l10 4-10 4z"/><ellipse cx="12" cy="21" rx="8" ry="1.6" fill="currentColor" opacity=".35"/></svg>
      Golf Trainer
    </div>
    <div class="status" id="status"><i></i><span>Connecting…</span></div>
  </header>
  <main id="main" class="view"><p class="muted">Loading your practice log…</p></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="practice" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>Practice</button>
    <button data-tab="swing">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 10l5-3v10l-5-3z" fill="currentColor"/></svg>Swing</button>
    <button data-tab="rounds">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18M7 4l9 3.5L7 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 21h18" stroke="currentColor" stroke-width="2"/></svg>Rounds</button>
    <button data-tab="progress">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18" stroke="currentColor" stroke-width="2"/><path d="M5 16l5-5 4 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>Progress</button>
  </div>
</nav>
<div id="tip" hidden></div>

<script>
"use strict";
// ---------------------------------------------------------------- helpers
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const newId = (kind) => kind + "-" + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const DAY = 86400000;
const fmtN = (v, d = 1) => (v == null || isNaN(v) ? "—" : Number(v).toLocaleString(undefined, { maximumFractionDigits: d }));
const fmtDate = (d, opts = { month: "short", day: "numeric", year: "numeric" }) => new Date(d).toLocaleDateString(undefined, opts);
const fmtDateTime = (d) => new Date(d).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const toLocalInput = (d) => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 16); };
const toDateInput = (d) => toLocalInput(d).slice(0, 10);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const fmtIndex = (i) => (i == null ? "—" : (i < 0 ? "+" + Math.abs(i).toFixed(1) : Number(i).toFixed(1)));
function toast(msg, ms = 2600) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}

// ---------------------------------------------------------------- reference data
const CATS = {
  range: { title: "Range", color: "var(--s1)" },
  shortGame: { title: "Short Game", color: "var(--s2)" },
  putting: { title: "Putting", color: "var(--s3)" },
};
const CAT_KEYS = ["range", "shortGame", "putting"];
const METRICS = {
  makes: { title: "Makes / attempts", short: "Make %", higher: true },
  points: { title: "Points (higher is better)", short: "Points", higher: true },
  strokes: { title: "Strokes (lower is better)", short: "Strokes", higher: false },
  proximity: { title: "Avg. proximity in ft (lower is better)", short: "Avg ft", higher: false },
};
const DRILLS = [
  ["Fairway Finder", "range", "makes", 14, 60, "Pick two flags about 30 yards apart as your fairway. Hit 14 drives with a full pre-shot routine. A make is a ball that finishes between them."],
  ["Target Window", "range", "makes", 10, 50, "Choose a mid-iron target. A make is a ball that finishes within 10 yards of it. Change clubs every shot."],
  ["Wedge Ladder", "range", "makes", 12, 60, "Hit wedges to 50, 60, 70, 80, 90 and 100 yards, then back down. A make is a carry within 5 yards of the number."],
  ["9-Shot Shaping", "range", "makes", 9, 66, "Hit a draw, a straight ball and a fade, each one low, mid and high. A make is the shape you called."],
  ["Play the Course", "range", "points", 18, 12, "Play a round you know on the range: driver, then the approach club for each hole. Score 1 point for each fairway or green you would have hit."],
  ["Tempo / Contact", "range", "makes", 20, 75, "Hit half and three-quarter swings with a 7-iron. A make is centred contact, with ball first and then turf."],
  ["Up & Down Challenge", "shortGame", "makes", 9, 50, "Drop 9 balls around the green with varied lies. A make is getting down in 2 (chip and putt)."],
  ["Par 18", "shortGame", "strokes", 9, 18, "Play 9 'holes' from random spots around the green and hole out each one. Par is 2 per hole, so 18 total."],
  ["Landing Spot", "shortGame", "makes", 10, 60, "Put a towel on the green as your landing spot. A make is a chip that lands on the towel."],

}

const CSV_FIELDS = {

  course: ["course", "course name", "club", "golf course"],
  holes: ["holes", "holes played", "# holes"],
  par: ["par", "course par"],
  score: ["score", "gross", "gross score", "total", "total score", "strokes"],
  putts: ["putts", "total putts", "# putts"],
  fairways: ["fairways", "fir", "fairways hit", "fairways in regulation", "fw hit"],
  fairwaysPossible: ["fairways possible", "fairway attempts", "fir possible", "fw possible"],
  gir: ["gir", "greens", "greens in regulation", "greens hit"],
  ud: ["up and downs", "up & downs", "up&down", "scrambling", "up and down made"],
  udAttempts: ["up and down attempts", "scrambling attempts", "up & down attempts"],
  penalties: ["penalties", "penalty strokes", "penalty"],
  handicap: ["handicap", "handicap index", "hcp", "hcp index", "index", "grint handicap"],

function parseCSVRows(text) {
  text = text.replace(/\r\n?/g, "\n");
  const first = text.split("\n", 1)[0];
  const delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }

}
const normHeader = (h) => h.replace(/^﻿/, "").trim().toLowerCase().replace(/_/g, " ").replace(/\s+/g, " ");
function parseDateLoose(s) {
  let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], 12);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);

  const t = Date.parse(s); if (!isNaN(t)) { const d = new Date(t); d.setHours(12, 0, 0, 0); return d; }
  return null;
}
const parseIntLoose = (s) => { if (s == null || s === "") return null; const n = Number(s); return isNaN(n) ? null : Math.round(n); };
const parseFrac = (s) => { const m = String(s || "").match(/^\s*(\d+)\s*\/\s*(\d+)\s*$/); return m ? [+m[1], +m[2]] : null; };
const parseHcp = (s) => { if (!s) return null; s = s.trim(); if (s.startsWith("+")) { const v = Number(s.slice(1)); return isNaN(v) ? null : -v; } const v = Number(s); return isNaN(v) ? null : v; };
function importKey(r) { return `grint|${toDateInput(r.date)}|${r.course.toLowerCase()}|${r.score}`; }
function parseRoundsCSV(text) {
  const rows = parseCSVRows(text);
  if (!rows.length) throw new Error("The file is empty.");
  const header = rows[0].map(normHeader);
  const col = {};
  for (const [k, aliases] of Object.entries(CSV_FIELDS)) { const i = header.findIndex((h) => aliases.includes(h)); if (i >= 0) col[k] = i; }
  const missing = [["date", "Date"], ["score", "Score"]].filter(([k]) => col[k] == null).map(([, n]) => n);
  if (missing.length) throw new Error(`Couldn't find the required column(s): ${missing.join(", ")}. Make sure the first row holds column headers.`);
  const rounds = [], warnings = [];
  rows.slice(1).forEach((row, i) => {
    const n = i + 2;
    const cell = (k) => { const j = col[k]; if (j == null || j >= row.length) return null; const v = row[j].trim(); return v === "" ? null : v; };
    const date = cell("date") ? parseDateLoose(cell("date")) : null;
    if (!date) { warnings.push(`Row ${n}: couldn't read the date, so the row was skipped.`); return; }
    const score = parseIntLoose(cell("score"));
    if (!score || score <= 0) { warnings.push(`Row ${n}: missing score, so the row was skipped.`); return; }
    const holes = parseIntLoose(cell("holes")) ?? (score < 60 ? 9 : 18);
    const par = parseIntLoose(cell("par")) ?? (holes === 9 ? 36 : 72);
    let fw = parseIntLoose(cell("fairways")), fwp = parseIntLoose(cell("fairwaysPossible"));
    const fwf = parseFrac(cell("fairways")); if (fwf) { fw = fwf[0]; fwp = fwp ?? fwf[1]; }
    let ud = parseIntLoose(cell("ud")), uda = parseIntLoose(cell("udAttempts"));
    const udf = parseFrac(cell("ud")); if (udf) { ud = udf[0]; uda = uda ?? udf[1]; }
    let gir = parseIntLoose(cell("gir")); const gf = parseFrac(cell("gir")); if (gf) gir = gf[0];
    const r = { date, course: cell("course") || "Unknown course", holes, par, score, putts: parseIntLoose(cell("putts")), fairwaysHit: fw, fairwaysPossible: fwp, gir, upDowns: ud, upDownAttempts: uda, penalties: parseIntLoose(cell("penalties")), handicap: parseHcp(cell("handicap")) };
    r.importKey = importKey(r);
    rounds.push(r);

}

function ingest(records) {

}

      </button>`;
    }).join("")}</div>

      `<div class="list">${filtered.slice(0, 40).map((s) => sessionRow(s, ui.practiceFilter === "all")).join("")}</div>`}

// session logger ---------------------------------------------------
function openLogger(cat, existing) {
  const draft = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: newId("session"), kind: "session", cat, date: new Date().toISOString(), durationMinutes: null, ballsHit: null,
    location: (() => { try { return localStorage.getItem("golf-last-location") || ""; } catch (e) { return ""; } })(), rating: 3, notes: "", drills: [],
  };
  draft.drills.forEach((d) => { d.reps = drillTemplate(d.name)?.reps || d.attempts; d.hist = []; });
  const openedAt = Date.now();
  let picking = false;
  openSheet((el) => {
    el.innerHTML = sheetFrame(existing ? "Edit session" : `New ${CATS[draft.cat].title} session`, `<button class="btn primary sm" data-l="save">Save</button>`, `
      <div class="form">
        <label class="field"><span>Date</span><input type="datetime-local" id="lg-date" value="${toLocalInput(draft.date)}"></label>
        <label class="field"><span>Location</span><input id="lg-loc" value="${esc(draft.location)}" placeholder="Optional"></label>
        ${existing ? "" : `<div class="field"><span>Session timer</span><div class="timer num" id="lg-timer">0:00</div></div>`}
        <label class="field"><span>Duration (minutes)</span><input type="number" min="0" inputmode="numeric" id="lg-dur" value="${draft.durationMinutes ?? ""}" placeholder="${existing ? "" : "Uses the timer"}"></label>
        ${draft.cat === "range" ? `<label class="field"><span>Balls hit</span><input type="number" min="0" inputmode="numeric" id="lg-balls" value="${draft.ballsHit ?? ""}" placeholder="Optional"></label>` : ""}
      </div>
      <div class="section"><div class="spread"><h3>Drills</h3></div><div id="lg-drills" class="section"></div>
        <div id="lg-picker"></div>
      </div>
      <div class="section"><h3>How did it go?</h3>
        <div class="stars" id="lg-stars"></div>
        <label class="field"><textarea id="lg-notes" placeholder="Swing thoughts, what worked, what to work on next">${esc(draft.notes)}</textarea></label>
      </div>`);
    const drawDrills = () => {
      $("#lg-drills", el).innerHTML = draft.drills.length ? draft.drills.map((d, i) => drillCard(d, i)).join("") : `<p class="muted small">Add drills from the library, or make your own. Each one is charted on the Progress tab.</p>`;
      $("#lg-picker", el).innerHTML = picking ? drillPicker(draft.cat) : `<button class="btn" data-l="pick">+ Add drill</button>`;
    };
    const drawStars = () => { $("#lg-stars", el).innerHTML = [1, 2, 3, 4, 5].map((i) => `<button data-l="star" data-i="${i}" aria-label="${i} star${i > 1 ? "s" : ""}">${i <= draft.rating ? "★" : "☆"}</button>`).join(""); };
    drawDrills(); drawStars();
    const tick = setInterval(() => { const t = $("#lg-timer", el); if (t) { const s = Math.floor((Date.now() - openedAt) / 1000); t.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; } }, 1000);
    el.addEventListener("click", (e) => {
      const b = e.target.closest("[data-l]"); if (!b) return;
      const i = +b.dataset.i; const d = draft.drills[i];
      switch (b.dataset.l) {
        case "make": d.attempts++; d.successes++; d.hist.push(1); break;
        case "miss": d.attempts++; d.hist.push(0); break;
        case "undo": { if (!d.attempts) break; const last = d.hist.length ? d.hist.pop() : (d.successes === d.attempts ? 1 : 0); d.attempts--; if (last) d.successes = Math.max(0, d.successes - 1); d.successes = Math.min(d.successes, d.attempts); break; }
        case "inc": d.value = (Number(d.value) || 0) + 1; break;
        case "dec": d.value = Math.max(0, (Number(d.value) || 0) - 1); break;
        case "rm": draft.drills.splice(i, 1); break;
        case "pick": picking = true; break;
        case "pick-cancel": picking = false; break;
        case "pick-one": { const t = DRILLS[+b.dataset.t]; draft.drills.push({ name: t.name, metric: t.metric, attempts: t.metric === "makes" ? 0 : t.reps, successes: 0, value: 0, notes: "", reps: t.reps, hist: [] }); picking = false; break; }
        case "pick-custom": {
          const name = $("#cu-name", el).value.trim(); if (!name) { toast("Give the drill a name first."); return; }
          const metric = $("#cu-metric", el).value; const reps = Math.max(1, +$("#cu-reps", el).value || 10);
          draft.drills.push({ name, metric, attempts: metric === "makes" ? 0 : reps, successes: 0, value: 0, notes: "", reps, hist: [] }); picking = false; break;
        }
        case "star": draft.rating = +b.dataset.i; drawStars(); return;
        case "save": save(); return;
        default: return;
      }
      drawDrills();
    });
    el.addEventListener("input", (e) => {
      const f = e.target.dataset.f; if (!f) return;
      const d = draft.drills[+e.target.dataset.i];
      if (f === "value") d.value = Number(e.target.value) || 0;
      if (f === "attempts") d.attempts = Math.max(0, parseInt(e.target.value) || 0);
      if (f === "notes") d.notes = e.target.value;
    });
    async function save() {
      draft.date = new Date($("#lg-date", el).value || Date.now()).toISOString();
      draft.location = $("#lg-loc", el).value.trim();
      const dur = $("#lg-dur", el).value;
      draft.durationMinutes = dur !== "" ? Math.max(0, parseInt(dur) || 0) : Math.max(1, Math.round((Date.now() - openedAt) / 60000));
      const balls = $("#lg-balls", el); draft.ballsHit = balls && balls.value !== "" ? parseInt(balls.value) : null;
      draft.notes = $("#lg-notes", el).value.trim();
      const rec = JSON.parse(JSON.stringify(draft));
      rec.drills = rec.drills.map(({ hist, reps, ...d }) => ({ ...d, successes: Math.min(d.successes, d.attempts) }));
      try { if (rec.location) localStorage.setItem("golf-last-location", rec.location); } catch (e) { /* ignore */ }
      await saveRec(rec);
      closeSheet(); render(); toast("Session saved.");
    }
    return () => clearInterval(tick);
  });
}
function drillCard(d, i) {
  let controls = "";
  if (d.metric === "makes") {
    const pct = d.reps ? Math.min(100, (d.attempts / d.reps) * 100) : 0;
    controls = `<div class="meter" title="${d.attempts} of ${d.reps} reps"><i style="width:${pct}%"></i></div>
      <div class="spread tiny muted"><span>${d.attempts} of ${d.reps} reps</span></div>
      <div class="mm"><button class="miss" data-l="miss" data-i="${i}">✕ Miss</button><button class="make" data-l="make" data-i="${i}">✓ Make</button><button class="undo" data-l="undo" data-i="${i}" aria-label="Undo last" ${d.attempts ? "" : "disabled"}>↶</button></div>`;
  } else if (d.metric === "proximity") {
    controls = `<div class="form"><label class="field"><span>Average distance (ft)</span><input type="number" step="0.1" min="0" inputmode="decimal" data-f="value" data-i="${i}" value="${d.value || ""}"></label>
      <label class="field"><span>Balls</span><input type="number" min="0" inputmode="numeric" data-f="attempts" data-i="${i}" value="${d.attempts}"></label></div>`;
  } else {
    controls = `<div class="stepper"><button data-l="dec" data-i="${i}" aria-label="Minus one">−</button><input class="inp num" type="number" min="0" data-f="value" data-i="${i}" value="${d.value || 0}"><button data-l="inc" data-i="${i}" aria-label="Plus one">+</button><span class="muted small">${d.metric === "points" ? "points" : "strokes"}</span></div>`;
  }
  return `<div class="drill"><div class="spread"><b>${esc(d.name)}</b><span class="num muted">${esc(drillSummary(d))}</span></div>${controls}
    <div class="spread"><input class="inp small" data-f="notes" data-i="${i}" value="${esc(d.notes)}" placeholder="Drill note (optional)" style="flex:1;min-width:0"><button class="btn ghost sm danger" data-l="rm" data-i="${i}">Remove</button></div></div>`;
}

function setupPlayer(el, w, saveSoon) {
  const v = $("#sw-video", el), cv = $("#sw-canvas", el), box = $("#sw-player", el), scrub = $("#sw-scrub", el);
  const playBtn = $("#sw-play", el), timeEl = $("#sw-time", el), drawBtn = $("#sw-draw", el), hint = $("#sw-hint", el);
  let drawing = false, color = 0, draft = null, raf = 0, aspect = 9 / 16;
  v.playbackRate = 0.5;
  const fps = () => +$("#sw-fps", el).value || 30;
  v.addEventListener("loadedmetadata", () => {
    if (v.videoWidth && v.videoHeight) { aspect = v.videoWidth / v.videoHeight; box.style.aspectRatio = `${v.videoWidth} / ${v.videoHeight}`; box.style.width = `min(100%, calc(62vh * ${aspect.toFixed(4)}))`; }
    scrub.max = v.duration || 1; size();
  });
  v.addEventListener("play", () => { playBtn.textContent = "Pause"; v.playbackRate = +$("#sw-rate", el).value; });
  v.addEventListener("pause", () => { playBtn.textContent = "Play"; });
  $("#sw-rate", el).addEventListener("change", (e) => { v.playbackRate = +e.target.value; });
  $("#sw-fps", el).addEventListener("change", (e) => { w.fps = +e.target.value; saveSoon(); });
  scrub.addEventListener("input", () => { v.pause(); v.currentTime = +scrub.value; });
  const loop = () => { if (!scrub.matches(":active")) scrub.value = v.currentTime; timeEl.textContent = v.currentTime.toFixed(2) + "s / " + (v.duration || 0).toFixed(2) + "s"; raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
  const ro = new ResizeObserver(size); ro.observe(box);
  function size() { const r = box.getBoundingClientRect(); const d = window.devicePixelRatio || 1; cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); draw(); }
  function draw() {
    const ctx = cv.getContext("2d"); const W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H);
    drawLines(ctx, W, H, draft ? w.lines.concat([draft]) : w.lines, aspect, (window.devicePixelRatio || 1));
  }
  const norm = (e) => { const r = cv.getBoundingClientRect(); return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) }; };

  const end = () => { if (!draft) return; if (Math.hypot(draft.x2 - draft.x1, draft.y2 - draft.y1) > 0.015) { w.lines.push(draft); saveSoon(); } draft = null; draw(); };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  const drawCps = () => {
    $("#sw-cps", el).innerHTML = w.checkpoints.slice().sort((a, b) => a.t - b.t).map((c) => `<button class="chip num" data-p="seek" data-t="${c.t}" title="Jump to ${esc(POS_TITLE[c.pos])}">${esc(POS_TITLE[c.pos])} ${c.t.toFixed(2)}s</button><button class="chip" data-p="rm-cp" data-k="${c.pos}" aria-label="Remove ${esc(POS_TITLE[c.pos])}">×</button>`).join("");
  };
  drawCps();
  $("#sw-mark", el).addEventListener("change", (e) => {
    const pos = e.target.value; if (!pos) return;
    w.checkpoints = w.checkpoints.filter((c) => c.pos !== pos).concat([{ pos, t: Math.round(v.currentTime * 1000) / 1000 }]);
    e.target.value = ""; drawCps(); saveSoon(); const n = $("#sw-anote", el); if (n && w.checkpoints.length) n.textContent = "Marked positions go into the analysis as labelled frames.";
  });

    video: v, aspect: () => aspect,
    handle(p, b) {
      switch (p) {
        case "play": v.paused ? v.play() : v.pause(); return true;
        case "back": v.pause(); v.currentTime = Math.max(0, v.currentTime - 1 / fps()); return true;
        case "fwd": v.pause(); v.currentTime = Math.min(v.duration || 0, v.currentTime + 1 / fps()); return true;
        case "draw": drawing = !drawing; if (drawing) { v.pause(); box.scrollIntoView({ block: "nearest" }); } drawBtn.textContent = drawing ? "Done drawing" : "Draw lines"; drawBtn.classList.toggle("primary", drawing); hint.hidden = !drawing; return true;
        case "color": color = +b.dataset.i; $$("[data-p=color]", el).forEach((s) => s.setAttribute("aria-pressed", s === b)); return true;
        case "undo-line": w.lines.pop(); draw(); saveSoon(); return true;
        case "clear-lines": w.lines = []; draw(); saveSoon(); return true;
        case "seek": v.pause(); v.currentTime = +b.dataset.t; return true;
        case "rm-cp": w.checkpoints = w.checkpoints.filter((c) => c.pos !== b.dataset.k); drawCps(); saveSoon(); return true;

function drawLines(ctx, W, H, lines, aspect, scale = 1) {

    const a = [l.x1 * W, l.y1 * H], b = [l.x2 * W, l.y2 * H]; const col = LINE_COLORS[l.c] || LINE_COLORS[0];
    ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.lineWidth = lw + 2 * scale; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    ctx.fillStyle = col; for (const p of [a, b]) { ctx.beginPath(); ctx.arc(p[0], p[1], lw * 1.3, 0, Math.PI * 2); ctx.fill(); }
    const label = Math.round(lineAngle(l, aspect)) + "°";
    ctx.font = `bold ${Math.round(lw * 4.5)}px system-ui, sans-serif`; ctx.lineWidth = lw; ctx.strokeStyle = "rgba(0,0,0,.7)";
    const tx = (a[0] + b[0]) / 2 + lw * 3, ty = (a[1] + b[1]) / 2 - lw * 3;
    ctx.strokeText(label, tx, ty); ctx.fillText(label, tx, ty);
  }
}

// frames, sheets, analysis -------------------------------------------
function seekTo(v, t) {
  return new Promise((res) => { const done = () => { clearTimeout(to); res(); }; const to = setTimeout(done, 3000); v.addEventListener("seeked", done, { once: true }); v.currentTime = Math.min(Math.max(0, t), v.duration || t); });
}
function banner(ctx, text, width) {
  const fs = Math.max(16, Math.round(width / 22)); ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, width, fs * 1.8);
  ctx.fillStyle = "#fff"; ctx.font = `bold ${fs}px system-ui, sans-serif`; ctx.fillText(text, fs * 0.6, fs * 1.25);
}
async function captureFrames(player, w, times, withLines = true) {
  const v = player.video; const was = v.currentTime; v.pause();
  const out = [];
  for (const { t, label } of times) {
    await seekTo(v, t);
    const scale = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight)); const W = Math.round(v.videoWidth * scale), H = Math.round(v.videoHeight * scale);
    const c = document.createElement("canvas"); c.width = W; c.height = H; const ctx = c.getContext("2d");
    ctx.drawImage(v, 0, 0, W, H);
    if (withLines && w.lines.length) drawLines(ctx, W, H, w.lines, W / H, W / 600);
    out.push({ canvas: c, label });
  }
  await seekTo(v, was);
  return out;
}
const canvasBlob = (c, q = 0.85) => new Promise((res) => c.toBlob(res, "image/jpeg", q));
function keySheet(frames, title) {
  const [cols, rows] = gridLayout(frames.length); if (!cols) return null;
  const cw = 600, ch = Math.round(cw * frames[0].canvas.height / frames[0].canvas.width), gap = 8, head = title ? 56 : 0;
  const c = document.createElement("canvas"); c.width = cols * cw + (cols + 1) * gap; c.height = head + rows * ch + (rows + 1) * gap;
  const ctx = c.getContext("2d"); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, c.width, c.height);
  if (title) { ctx.fillStyle = "#fff"; ctx.font = "bold 30px system-ui, sans-serif"; ctx.fillText(title, gap * 2, 38); }
  frames.forEach((f, i) => {
    const x = gap + (i % cols) * (cw + gap), y = head + gap + Math.floor(i / cols) * (ch + gap);
    ctx.drawImage(f.canvas, x, y, cw, ch); ctx.save(); ctx.translate(x, y); banner(ctx, `${i + 1}. ${f.label}`, cw); ctx.restore();
  });
  return c;
}
function cpTimes(w) { return (w.checkpoints || []).slice().sort((a, b) => a.t - b.t).map((c) => ({ t: c.t, label: POS_TITLE[c.pos] })); }
async function saveKeySheet(w, player) {
  if (!player) return;
  if (!w.checkpoints.length) { toast("Mark at least one position first (Address, Top, Impact…)."); return; }
  try {
    const frames = await captureFrames(player, w, cpTimes(w));
    const sheet = keySheet(frames, swingTitle(w)); const blob = await canvasBlob(sheet);
    await caps.downloads.save({ filename: `${(w.club || "swing").replace(/\s+/g, "-")}-key-positions.jpg`, data: blob });
  } catch (e) { if (e?.code !== "declined") toast("Couldn't save the image: " + (e?.message || e?.code || "")); }
}
async function analyzeSwing(w, el, player) {
  const out = $("#sw-stream", el), btn = $("[data-p=analyze]", el);
  if (!caps.sample) return;
  if (!caps.sampleImages) { toast("Image analysis isn't available in this view. Use Copy context for chat instead.", 4000); return; }
  btn.disabled = true; out.hidden = false; out.textContent = "Preparing frames…";
  try {
    const blobs = [], names = [];
    if (player) {
      const times = w.checkpoints.length ? cpTimes(w) : [{ t: player.video.currentTime, label: "Current frame" }];
      const frames = await captureFrames(player, w, times);
      if (frames.length > 1) { const sheet = keySheet(frames, swingTitle(w)); blobs.push(await canvasBlob(sheet)); names.push(`Key positions sheet (${frames.map((f) => f.label).join(" → ")})`); }
      for (const f of frames) { const ctx = f.canvas.getContext("2d"); banner(ctx, f.label, f.canvas.width); blobs.push(await canvasBlob(f.canvas)); names.push(`${f.label} frame`); }
    }
    for (const m of w.images) { const u = mediaURL(m); if (!u) continue; try { blobs.push(await (await fetch(u)).blob()); names.push("Screenshot from the golfer's video app"); } catch (e) { /* skip unreadable */ } }
    const n = Math.min(blobs.length, caps.sampleImages);
    if (!n) { out.textContent = "Nothing to analyse yet: add a video or screenshots."; btn.disabled = false; return; }
    const prompt = `You are an experienced PGA golf instructor reviewing a student's swing from still images.\n\n${swingContext(w, { sheet: true })}\n\nImages attached, in order:\n${names.slice(0, n).map((x, i) => `${i + 1}. ${x}`).join("\n")}\nColoured lines and degree labels, if present, were drawn by the golfer (for example shaft plane or spine angle).\n\nReply in plain text with these headings: "What I see", "Biggest issues" (one or two, each with its likely cause), "Drills" (one per issue, with reps), and "Feel to try". Be specific to what is visible, say when a frame doesn't show enough to judge, and keep it under 350 words.`;
    out.textContent = "Thinking…";
    const res = await caps.sample(prompt, { images: blobs.slice(0, n), onText: ({ text }) => { out.textContent = text; } });
    const stamp = `Claude analysis, ${fmtDateTime(new Date())}`;
    w.analysis = `${stamp}\n${res.text}${w.analysis ? "\n\n—\n" + w.analysis : ""}`; w.analysisDate = new Date().toISOString();
    $("#sw-analysis", el).value = w.analysis; out.hidden = true;

}

        for (const r of parsed.fresh) {
          recs.push({ id: newId("round"), kind: "round", source: "grint", date: r.date.toISOString(), course: r.course, holes: r.holes, par: r.par, score: r.score, putts: r.putts, fairwaysHit: r.fairwaysHit, fairwaysPossible: r.fairwaysPossible, gir: r.gir, upDowns: r.upDowns, upDownAttempts: r.upDownAttempts, penalties: r.penalties, importKey: r.importKey, notes: "" });
          if (r.handicap != null && !hDays.has(r.date.toDateString())) { hDays.add(r.date.toDateString()); recs.push({ id: newId("handicap"), kind: "handicap", date: r.date.toISOString(), index: r.handicap, source: "grint" }); }

// ---------------------------------------------------------------- PROGRESS
VIEWS_progress = function () {
  const scopes = [["overall", "Overall"], ["range", "Range"], ["shortGame", "Short Game"], ["putting", "Putting"], ["rounds", "Rounds"]];
  const head = `<div class="chips">${scopes.map(([k, t]) => `<button class="chip" data-act="scope" data-k="${k}" aria-pressed="${ui.scope === k}">${t}</button>`).join("")}</div>`;
  let body = "";
  if (ui.scope === "overall") body = overallView();
  else if (ui.scope === "rounds") body = roundsProgress();
  else body = categoryProgress(ui.scope);
  const hasSample = allRecords().some((r) => r.sample);
  return head + body + (hasSample ? `<div class="notice spread"><span>Sample data is showing alongside your own.</span><button class="btn sm" data-act="clear-sample">Remove sample data</button></div>` : "");
};
const tile = (k, v, c = "", color = "") => `<div class="tile"><span class="k">${k}</span><span class="v num" ${color ? `style="color:${color}"` : ""}>${v}</span>${c ? `<span class="c">${c}</span>` : ""}</div>`;
function overallView() {
  const cutoff = Date.now() - 30 * DAY;
  const recent = S.session.filter((s) => new Date(s.date) >= cutoff);
  const mins = Object.fromEntries(CAT_KEYS.map((c) => [c, recent.filter((s) => s.cat === c).reduce((a, s) => a + (+s.durationMinutes || 0), 0)]));
  const total = Object.values(mins).reduce((a, b) => a + b, 0);
  const rounds18 = S.round.filter((r) => r.holes === 18).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  const scores = rounds18.map((r) => r.score);
  const h = S.handicap.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  const hc = h.length >= 2 ? `${h[h.length - 1].index - h[0].index > 0 ? "+" : ""}${(h[h.length - 1].index - h[0].index).toFixed(1)} since ${fmtDate(h[0].date, { month: "short", year: "numeric" })}` : "";
  const streak = streakDays(S.session.map((s) => s.date));
  const hrs = (m) => (m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`);
  const makeTrend = (cat) => trend(S.session.filter((s) => s.cat === cat).slice().reverse().map((s) => {
    const mk = (s.drills || []).filter((d) => d.metric === "makes"); const att = mk.reduce((a, d) => a + d.attempts, 0);
    return att ? mk.reduce((a, d) => a + d.successes, 0) / att : null;
  }).filter((v) => v != null), true);
  if (!S.session.length && !S.round.length) return emptySample("Nothing to chart yet. Log a session or a round and your progress shows up here.");
  return `
  <div class="tiles">
    ${tile("Handicap", fmtIndex(latestHandicap()?.index), hc)}
    ${tile("Practice, last 30 days", hrs(total), `${recent.length} session${recent.length === 1 ? "" : "s"}`)}
    ${tile("Streak", `${streak} day${streak === 1 ? "" : "s"}`)}
    ${tile("Scoring avg (last 5)", scores.length ? fmtN(average(scores.slice(-5))) : "—", "18-hole rounds")}
    ${tile("Swings, last 30 days", S.swing.filter((w) => new Date(w.date) >= cutoff).length, `${S.swing.length} total`)}
    ${tile("Lessons", S.lesson.length, S.lesson[0] ? "Last: " + fmtDate(S.lesson[0].date, { month: "short", day: "numeric" }) : "")}
  </div>
  <div class="card"><div class="spread"><h3>Practice minutes per week</h3><div class="legend">${CAT_KEYS.map((c) => `<span><i class="dot" style="background:${CATS[c].color}"></i>${CATS[c].title}</span>`).join("")}</div></div>
    ${barChart(weeklyMinutes(S.session).map((w) => ({ t: w.start, label: "Week of " + fmtDate(w.start, { month: "short", day: "numeric" }), parts: CAT_KEYS.map((c) => ({ name: CATS[c].title, v: w[c], color: CATS[c].color })) })), { fmt: (v) => `${v} min` })}
  </div>
  <div class="card"><h3>Practice mix, last 30 days</h3>
    ${total ? `<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface)">${CAT_KEYS.filter((c) => mins[c]).map((c) => `<span style="flex:${mins[c]};background:${CATS[c].color}" title="${CATS[c].title}: ${mins[c]} min"></span>`).join("")}</div>
      <div class="legend">${CAT_KEYS.map((c) => `<span><i class="dot" style="background:${CATS[c].color}"></i>${CATS[c].title} <b class="num">${Math.round((mins[c] / total) * 100)}%</b> <span class="muted num">${mins[c]}m</span></span>`).join("")}</div>` : `<p class="muted small">No practice in the last 30 days.</p>`}
  </div>
  <div class="card"><h3>Skill trends</h3>
    ${CAT_KEYS.map((c) => `<div class="spread"><span class="row"><i class="dot" style="background:${CATS[c].color}"></i>${CATS[c].title}</span>${trendHTML(makeTrend(c))}</div>`).join("")}
    <div class="spread"><span>Scoring</span>${trendHTML(trend(scores, false))}</div>
    <p class="tiny muted">Practice trends compare make % on make/miss drills over your last 5 sessions with the 5 before.</p>
  </div>`;
}
function categoryProgress(cat) {
  const sessions = S.session.filter((s) => s.cat === cat);
  if (!sessions.length) return `<div class="empty"><p><b>No ${CATS[cat].title.toLowerCase()} sessions yet.</b></p><p class="muted small">Log one from the Practice tab to chart it here.</p></div>`;
  const used = new Set(sessions.flatMap((s) => (s.drills || []).map((d) => d.name)));
  const names = DRILLS.filter((d) => d.cat === cat && used.has(d.name)).map((d) => d.name).concat([...used].filter((n) => !DRILLS.some((d) => d.name === n && d.cat === cat)).sort());
  const pick = names.includes(ui.drillPick[cat]) ? ui.drillPick[cat] : names[0];
  const totalMin = sessions.reduce((a, s) => a + (+s.durationMinutes || 0), 0);
  let chart = `<p class="muted small">No drills logged in these sessions yet.</p>`;
  if (pick) {
    const results = sessions.flatMap((s) => (s.drills || []).filter((d) => d.name === pick).map((d) => ({ t: new Date(s.date), d }))).sort((a, b) => a.t - b.t);
    const metric = results.length ? results[results.length - 1].d.metric : "makes";
    const pts = results.map(({ t, d }) => ({ t, v: drillValue(d) })).filter((p) => p.v != null);
    const fmt = (v) => metric === "makes" ? `${Math.round(v)}%` : metric === "proximity" ? `${fmtN(v)} ft` : fmtN(v);
    const tmpl = drillTemplate(pick);
    const best = pts.length ? (METRICS[metric].higher ? Math.max(...pts.map((p) => p.v)) : Math.min(...pts.map((p) => p.v))) : null;
    chart = pts.length ? `${lineChart({ points: pts, smooth: movingAverage(pts, 3), goal: tmpl?.goal, color: CATS[cat].color, fmt, zero: metric === "makes", name: METRICS[metric].short })}
      <div class="spread small"><span>Best: <b class="num">${fmt(best)}</b>${tmpl ? ` · Goal: ${goalText(tmpl)}` : ""}</span>${trendHTML(trend(pts.map((p) => p.v), METRICS[metric].higher))}</div>
      <p class="tiny muted">Dots are single sessions; the line is a 3-session average.</p>` : `<p class="muted small">No scored results yet.</p>`;
  }
  return `<div class="tiles">
    ${tile("Sessions", sessions.length)}${tile("Total time", `${Math.floor(totalMin / 60)}h ${totalMin % 60}m`)}
    ${cat === "range" ? tile("Balls hit", sessions.reduce((a, s) => a + (+s.ballsHit || 0), 0).toLocaleString()) : ""}
    ${tile("Avg. rating", fmtN(average(sessions.map((s) => s.rating || 0))) + "★", "", "var(--star)")}
  </div>
  <div class="card"><div class="spread"><h3>${pick ? esc(pick) : "Drills"}</h3>
    ${names.length > 1 ? `<select class="inp" style="width:auto" data-change="drill-pick" data-cat="${cat}" aria-label="Choose drill">${names.map((n) => `<option ${n === pick ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>` : ""}</div>
    ${chart}</div>`;
}
function roundsProgress() {
  if (!S.round.length) return emptySample("No rounds yet. Add or import rounds to see your scoring trends.");
  const asc = S.round.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  const r18 = asc.filter((r) => r.holes === 18);
  const pct = (vals) => (vals.length ? Math.round(average(vals) * 100) + "%" : "—");
  const gir = r18.filter((r) => r.gir != null).map((r) => r.gir / r.holes);
  const fw = asc.filter((r) => r.fairwaysHit != null && r.fairwaysPossible).map((r) => r.fairwaysHit / r.fairwaysPossible);
  const ud = asc.filter((r) => r.upDowns != null && r.upDownAttempts).map((r) => r.upDowns / r.upDownAttempts);
  const putts = r18.filter((r) => r.putts != null);
  const scorePts = r18.map((r) => ({ t: new Date(r.date), v: r.score, label: r.course }));
  const hc = S.handicap.slice().sort((a, b) => new Date(a.date) - new Date(b.date)).map((h) => ({ t: new Date(h.date), v: h.index }));
  return `<div class="tiles">
    ${tile("Best 18", r18.length ? Math.min(...r18.map((r) => r.score)) : "—")}
    ${tile("Putts per round", putts.length ? fmtN(average(putts.map((r) => r.putts))) : "—")}
    ${tile("Greens in reg.", pct(gir))}${tile("Fairways", pct(fw))}${tile("Up & down", pct(ud))}${tile("Rounds", S.round.length)}
  </div>
  <div class="card"><h3>Score, 18 holes</h3>${scorePts.length ? lineChart({ points: scorePts, smooth: movingAverage(scorePts, 5), color: "var(--s1)", fmt: (v) => fmtN(v, 1), name: "Score" }) + `<p class="tiny muted">The line is a 5-round average.</p>` : `<p class="muted small">No 18-hole rounds yet.</p>`}</div>
  <div class="card"><h3>Handicap index</h3>${hc.length >= 2 ? lineChart({ points: hc, color: "var(--s1)", fmt: fmtIndex, name: "Index" }) : `<p class="muted small">Update your index on the Rounds tab, or import it from TheGrint, to chart it.</p>`}</div>
  <div class="card"><h3>Putts per round</h3>${putts.length ? barChart(putts.map((r) => ({ t: new Date(r.date), label: `${fmtDate(r.date, { month: "short", day: "numeric" })} · ${r.course}`, parts: [{ name: "Putts", v: r.putts, color: "var(--s1)" }] })), { fmt: (v) => `${v} putts` }) : `<p class="muted small">Track putts on your rounds to see this.</p>`}</div>`;
}

// ---------------------------------------------------------------- charts (inline SVG + hover tooltips)
const CHARTS = {}; let chartSeq = 0;
function niceTicks(a, b, n = 4) {
  if (a === b) { a -= 1; b += 1; }
  const raw = (b - a) / n, mag = 10 ** Math.floor(Math.log10(raw)), e = raw / mag;
  const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
  const out = []; for (let v = Math.floor(a / step) * step; v <= Math.ceil(b / step) * step + step / 2; v += step) out.push(+v.toFixed(10));
  return out;
}
function dataTable(head, rows) {
  return `<details class="table"><summary>Show data table</summary><div class="scroll"><table><thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;
}
function lineChart(o) {
  const id = "c" + ++chartSeq, W = 640, H = 220, m = { l: 44, r: 16, t: 14, b: 26 };
  const pts = o.points; const ts = pts.map((p) => +p.t);
  let x0 = Math.min(...ts), x1 = Math.max(...ts); if (x0 === x1) { x0 -= 3 * DAY; x1 += 3 * DAY; }
  const vals = pts.map((p) => p.v).concat(o.goal != null ? [o.goal] : []);
  let y0 = Math.min(...vals), y1 = Math.max(...vals); if (o.zero) y0 = Math.min(0, y0);
  const ticks = niceTicks(y0, y1, 4); y0 = ticks[0]; y1 = ticks[ticks.length - 1];
  const X = (t) => m.l + ((t - x0) / (x1 - x0)) * (W - m.l - m.r), Y = (v) => H - m.b - ((v - y0) / (y1 - y0 || 1)) * (H - m.t - m.b);
  const line = (o.smooth || pts).map((p, i) => `${i ? "L" : "M"}${X(+p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");
  const xl = [pts[0], pts[Math.floor(pts.length / 2)], pts[pts.length - 1]].filter((p, i, a) => a.indexOf(p) === i);
  CHARTS[id] = { kind: "line", pts: pts.map((p) => ({ x: X(+p.t), y: Y(p.v), text: `${fmtDate(p.t, { month: "short", day: "numeric" })}${p.label ? " · " + p.label : ""} · ${o.fmt(p.v)}` })), W, H, color: o.color };
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.name)} over time">
    ${ticks.map((t) => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${esc(o.fmt(t))}</text>`).join("")}
    ${xl.map((p, i) => `<text x="${X(+p.t)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === xl.length - 1 ? "end" : "middle"}" font-size="11" fill="var(--ink-3)">${esc(fmtDate(p.t, { month: "short", day: "numeric" }))}</text>`).join("")}
    ${o.goal != null ? `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" stroke="var(--ink-3)" stroke-dasharray="5 5" stroke-width="1.5"/><text x="${W - m.r}" y="${Y(o.goal) - 6}" text-anchor="end" font-size="11" fill="var(--ink-2)">Goal ${esc(o.fmt(o.goal))}</text>` : ""}
    <path d="${line}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p) => `<circle cx="${X(+p.t)}" cy="${Y(p.v)}" r="4" fill="${o.color}" stroke="var(--chart-bg)" stroke-width="2" opacity="${o.smooth ? 0.55 : 1}"/>`).join("")}
    <circle class="hl" r="6" fill="${o.color}" stroke="var(--chart-bg)" stroke-width="2" visibility="hidden"/>
    <rect class="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/>
  </svg></div>${dataTable(["Date", o.name], pts.map((p) => [fmtDate(p.t), o.fmt(p.v)]))}`;
}
function barChart(rows, o) {
  const id = "c" + ++chartSeq, W = 640, H = 200, m = { l: 40, r: 8, t: 10, b: 26 };
  const totals = rows.map((r) => r.parts.reduce((a, p) => a + p.v, 0));
  const ticks = niceTicks(0, Math.max(10, ...totals), 4); const y1 = ticks[ticks.length - 1];
  const Y = (v) => H - m.b - (v / y1) * (H - m.t - m.b);
  const band = (W - m.l - m.r) / rows.length, bw = Math.max(4, Math.min(28, band * 0.6));
  let marks = "";
  rows.forEach((r, i) => {
    const cx = m.l + band * (i + 0.5); let acc = 0; const segs = r.parts.filter((p) => p.v > 0);
    segs.forEach((p, k) => {
      const yTop = Y(acc + p.v), yBot = Y(acc); const gap = k > 0 ? 2 : 0; const h = Math.max(0, yBot - yTop - gap);
      const top = k === segs.length - 1; const x = cx - bw / 2, rr = Math.min(4, h);
      marks += top ? `<path d="M${x},${yTop + h} V${yTop + rr} Q${x},${yTop} ${x + rr},${yTop} H${x + bw - rr} Q${x + bw},${yTop} ${x + bw},${yTop + rr} V${yTop + h} Z" fill="${p.color}"/>` : `<rect x="${x}" y="${yTop}" width="${bw}" height="${h}" fill="${p.color}"/>`;
      acc += p.v;
    });
  });
  const lab = [0, Math.floor(rows.length / 2), rows.length - 1].filter((v, i, a) => a.indexOf(v) === i);
  CHARTS[id] = { kind: "bar", cols: rows.map((r, i) => ({ x: m.l + band * (i + 0.5), text: `${r.label}: ${r.parts.length > 1 ? r.parts.map((p) => `${p.name} ${p.v}`).join(", ") + ` (total ${o.fmt(totals[i])})` : o.fmt(totals[i])}` })), W, H, band };
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">
    ${ticks.map((t) => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${t}</text>`).join("")}
    ${lab.map((i, k) => `<text x="${m.l + band * (i + 0.5)}" y="${H - 6}" text-anchor="${k === 0 ? "start" : k === lab.length - 1 ? "end" : "middle"}" font-size="11" fill="var(--ink-3)">${esc(fmtDate(rows[i].t, { month: "short", day: "numeric" }))}</text>`).join("")}
    ${marks}
    <rect class="col" x="0" y="${m.t}" width="${bw + 8}" height="${H - m.t - m.b}" fill="var(--ink)" opacity="0.06" visibility="hidden"/>
    <rect class="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/>
  </svg></div>${dataTable(["Date", ...rows[0].parts.map((p) => p.name)], rows.map((r) => [fmtDate(r.t), ...r.parts.map((p) => p.v)]))}`;
}
function bindCharts(root) {
  const tip = $("#tip");
  $$("[data-chart]", root).forEach((box) => {
    const c = CHARTS[box.dataset.chart]; const svg = $("svg", box); if (!c || !svg) return;
    const move = (e) => {
      const r = svg.getBoundingClientRect(); const x = ((e.clientX - r.left) / r.width) * c.W;
      if (c.kind === "line") {
        let best = c.pts[0]; for (const p of c.pts) if (Math.abs(p.x - x) < Math.abs(best.x - x)) best = p;
        const hl = $(".hl", svg); hl.setAttribute("cx", best.x); hl.setAttribute("cy", best.y); hl.setAttribute("visibility", "visible");
        tip.textContent = best.text;
      } else {
        let best = c.cols[0]; for (const p of c.cols) if (Math.abs(p.x - x) < Math.abs(best.x - x)) best = p;
        const col = $(".col", svg); col.setAttribute("x", best.x - (+col.getAttribute("width")) / 2); col.setAttribute("visibility", "visible");
        tip.textContent = best.text;
      }
      tip.hidden = false;
      const tw = tip.offsetWidth; tip.style.left = Math.min(window.innerWidth - tw - 8, Math.max(8, e.clientX - tw / 2)) + "px"; tip.style.top = Math.max(8, e.clientY - 44) + "px";
    };
    const leave = () => { tip.hidden = true; $$(".hl,.col", svg).forEach((n) => n.setAttribute("visibility", "hidden")); };
    svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move); svg.addEventListener("pointerleave", leave);
  });
}

// ---------------------------------------------------------------- sheets
const sheets = [];
function sheetFrame(title, action, body) {
  return `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><button class="btn ghost sm" data-sheet-close>Close</button><h2>${esc(title)}</h2><span style="min-width:64px;display:flex;justify-content:flex-end">${action}</span></div><div class="sheet-body">${body}</div></div>`;
}
function openSheet(build) {
  if (sheets.length) { const top = sheets[sheets.length - 1]; top.cleanup?.(); top.el.remove(); }
  const el = document.createElement("div"); el.className = "scrim";
  document.body.appendChild(el); document.body.style.overflow = "hidden";
  const entry = { build, el, cleanup: null }; sheets.push(entry);
  entry.cleanup = build(el) || null;
  el.addEventListener("click", (e) => { if (e.target === el || e.target.closest("[data-sheet-close]")) closeSheet(); });
}
function closeSheet() {
  const top = sheets.pop(); if (!top) return;
  top.cleanup?.(); top.el.remove();
  if (sheets.length) { const prev = sheets.pop(); openSheet(prev.build); }
  else document.body.style.overflow = "";
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheets.length && !document.querySelector(".viewer")) closeSheet(); if (e.key === "Escape") document.querySelector(".viewer")?.remove(); });
