name: GolfTrainer
options:
  bundleIdPrefix: com.example.golftrainer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    # Set this to your Apple Developer Team ID (or pick the team in Xcode).
    DEVELOPMENT_TEAM: ""
targets:
  GolfTrainer:
    type: application
    platform: iOS
    sources: [GolfTrainer]
    dependencies:
      - target: GolfTrainerShare
        embed: true
    entitlements:
      path: GolfTrainer/GolfTrainer.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.golftrainer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.golftrainer.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Golf Trainer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Golf Trainer uses the camera to record your swing.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Golf Trainer records audio with swing videos, so you can hear the strike.

  GolfTrainerShare:
    type: app-extension
    platform: iOS
    sources:
      - GolfTrainerShare
      - GolfTrainer/Shared
    entitlements:
      path: GolfTrainerShare/GolfTrainerShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.golftrainer]
    info:
      path: GolfTrainerShare/Info.plist
      properties:
        CFBundleDisplayName: Golf Trainer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.golftrainer.app.share
        TARGETED_DEVICE_FAMILY: "1"

  GolfTrainerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GolfTrainerTests]
    dependencies:
      - target: GolfTrainer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GolfTrainer:
    build:
      targets:
        GolfTrainer: all
        GolfTrainerTests: [test]
    test:
      targets: [GolfTrainerTests]
